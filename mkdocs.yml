site_name: CKS Documentation
site_description: Canonical Knowledge Structure ecosystem documentation
repo_url: https://github.com/Deus-corp/cks-core
repo_name: GitHub

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

nav:
  - Home: index.md
  - Quick Start: quickstart.md

  - Case Studies:
      - Overview: case-studies/index.md
      - Catching Fake Citations: case-studies/catching-fake-citations.md
      - Semantic Search and Partial Merge: case-studies/semantic-search-and-partial-merge.md
      - Ontology Validation and Visualization: case-studies/ontology-validation-and-visualization.md
      - Contradiction Detection and Sandbox: case-studies/contradiction-detection-and-sandbox.md
      - Offline Semantic Search: case-studies/local-embeddings.md
      - Resolving a Reasoning Conflict with Inference Arbitration: case-studies/inference-conflict-resolution.md
      - Saving and Reusing Knowledge Graphs Across Sessions: case-studies/memory-agent-graph-reuse.md

